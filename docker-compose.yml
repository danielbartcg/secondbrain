# =============================================================================
# Second Brain : application Next.js + PostgreSQL.
# ./data/uploads (images des notes), ./data/documents (documents de projet) et
# ./data/downloads (installateurs de l'application desktop, publiés par desktop:publish)
# sont montés en volume.
# Guide : docs/10-deployment.md
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondbrain}
      POSTGRES_DB: secondbrain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposé en local uniquement pour le développement (prisma migrate dev).
      - "${DB_PORT:-127.0.0.1:5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain -d secondbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://secondbrain:${POSTGRES_PASSWORD:-secondbrain}@db:5432/secondbrain?schema=public"
      DATA_DIR: /app/data
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Définir SESSION_SECRET dans .env}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    ports:
      # Plusieurs applications cohabitent sur le serveur : chacune son port,
      # le reverse proxy (Caddy) route par nom de domaine.
      - "${APP_PORT:-3001}:3000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/documents:/app/data/documents
      - ./data/downloads:/app/data/downloads

  # Conteneur d'outillage : étage `builder` de l'image (arbre npm complet :
  # CLI Prisma, tsx, scripts/). Profil `tools` : jamais démarré par `up`,
  # invoqué à la demande (migrations au déploiement, `npm run prod:exec`).
  tools:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    user: "1001:1001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://secondbrain:${POSTGRES_PASSWORD:-secondbrain}@db:5432/secondbrain?schema=public"
      DATA_DIR: /app/data
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/documents:/app/data/documents
      - ./data/downloads:/app/data/downloads

volumes:
  postgres_data:
